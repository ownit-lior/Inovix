<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="inovixStroke" x1="18" y1="110" x2="110" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ED321"/>
      <stop offset="0.45" stop-color="#2A929B"/>
      <stop offset="1" stop-color="#1B6B8A"/>
    </linearGradient>
  </defs>
  <!-- House outline with intentional gap on lower-right -->
  <path
    d="M64 14 L18 52 V110 H78"
    stroke="url(#inovixStroke)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M98 110 V52 L64 14"
    stroke="url(#inovixStroke)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Interior marks (teal) -->
  <g stroke="#2A929B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- shield -->
    <path d="M52 34 L64 30 L76 34 V46 C76 54 70 58 64 60 C58 58 52 54 52 46 Z"/>
    <!-- camera -->
    <rect x="34" y="52" width="16" height="11" rx="2"/>
    <circle cx="42" cy="57.5" r="2.2" fill="#2A929B" stroke="none"/>
    <path d="M50 55 L56 52 V63 L50 60"/>
    <!-- lock -->
    <rect x="56" y="70" width="16" height="14" rx="2.5"/>
    <path d="M60 70 V64 C60 60 68 60 68 64 V70"/>
    <circle cx="64" cy="77" r="1.6" fill="#2A929B" stroke="none"/>
    <!-- wifi / signal -->
    <path d="M86 56 C90 60 90 66 86 70"/>
    <path d="M91 52 C98 58 98 68 91 74"/>
    <circle cx="84" cy="63" r="2" fill="#2A929B" stroke="none"/>
    <!-- gear hint -->
    <circle cx="42" cy="84" r="6"/>
    <circle cx="42" cy="84" r="2.2" fill="#2A929B" stroke="none"/>
  </g>
</svg>
